<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7B2FFF"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#b0b0b0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="1024" y2="200"/>
    <line x1="0" y1="400" x2="1024" y2="400"/>
    <line x1="0" y1="600" x2="1024" y2="600"/>
    <line x1="0" y1="800" x2="1024" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1024"/>
    <line x1="400" y1="0" x2="400" y2="1024"/>
    <line x1="600" y1="0" x2="600" y2="1024"/>
    <line x1="800" y1="0" x2="800" y2="1024"/>
  </g>
  
  <!-- Accent line top -->
  <rect x="100" y="280" width="824" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
  
  <!-- Shield / Lock shape -->
  <g transform="translate(512, 420)" filter="url(#shadow)">
    <!-- Shield outline -->
    <path d="M0,-140 L120,-100 L120,30 Q120,120 0,180 Q-120,120 -120,30 L-120,-100 Z" 
          fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.6"/>
    <!-- Shield fill -->
    <path d="M0,-130 L110,-92 L110,28 Q110,112 0,168 Q-110,112 -110,28 L-110,-92 Z" 
          fill="#0f0f1a" opacity="0.8"/>
    
    <!-- Car silhouette inside shield -->
    <g transform="translate(0, -15) scale(0.9)" fill="url(#carGrad)" filter="url(#glow)">
      <!-- Car body -->
      <path d="M-65,10 L-55,-20 L-30,-40 L30,-40 L55,-20 L65,10 Z" 
            fill="none" stroke="url(#carGrad)" stroke-width="4" stroke-linejoin="round"/>
      <!-- Car roof -->
      <path d="M-45,-20 L-30,-38 L30,-38 L45,-20" 
            fill="none" stroke="url(#carGrad)" stroke-width="3" stroke-linejoin="round"/>
      <!-- Car bottom -->
      <line x1="-65" y1="10" x2="65" y2="10" stroke="url(#carGrad)" stroke-width="4"/>
      <!-- Wheels -->
      <circle cx="-40" cy="18" r="10" fill="none" stroke="#00D4FF" stroke-width="3"/>
      <circle cx="40" cy="18" r="10" fill="none" stroke="#00D4FF" stroke-width="3"/>
      <!-- Headlights -->
      <ellipse cx="-58" cy="0" rx="4" ry="6" fill="#00D4FF" opacity="0.8"/>
      <ellipse cx="58" cy="0" rx="4" ry="6" fill="#7B2FFF" opacity="0.8"/>
    </g>
    
    <!-- Key symbol -->
    <g transform="translate(0, 85)" fill="none" stroke="#00D4FF" stroke-width="3" opacity="0.7">
      <circle cx="0" cy="0" r="12"/>
      <line x1="12" y1="0" x2="35" y2="0"/>
      <line x1="35" y1="0" x2="35" y2="8"/>
      <line x1="25" y1="0" x2="25" y2="6"/>
    </g>
  </g>
  
  <!-- Title: VEHICLE ACCESS -->
  <text x="512" y="680" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="72" font-weight="700" letter-spacing="8" fill="url(#accent)">
    VEHICLE
  </text>
  <text x="512" y="750" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" font-weight="300" letter-spacing="18" fill="#ffffff" opacity="0.9">
    ACCESS
  </text>
  
  <!-- Tagline -->
  <text x="512" y="800" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="18" font-weight="300" letter-spacing="6" fill="#ffffff" opacity="0.4">
    CONTROL DE ACCESO VEHICULAR
  </text>
  
  <!-- Accent line bottom -->
  <rect x="100" y="830" width="824" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
  
  <!-- Bottom decorative dots -->
  <g fill="#00D4FF" opacity="0.3">
    <circle cx="460" cy="900" r="3"/>
    <circle cx="512" cy="900" r="3"/>
    <circle cx="564" cy="900" r="3"/>
  </g>
</svg>
