<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7B2FFF"/>
    </linearGradient>
    <linearGradient id="accentDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7B2FFF"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c0c0c0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00D4FF" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  
  <!-- Subtle diagonal lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="200" y2="0"/>
    <line x1="0" y1="400" x2="400" y2="0"/>
    <line x1="0" y1="600" x2="600" y2="0"/>
    <line x1="0" y1="800" x2="800" y2="0"/>
    <line x1="0" y1="1000" x2="1000" y2="0"/>
    <line x1="200" y1="1024" x2="1024" y2="200"/>
    <line x1="400" y1="1024" x2="1024" y2="400"/>
    <line x1="600" y1="1024" x2="1024" y2="600"/>
    <line x1="800" y1="1024" x2="1024" y2="800"/>
  </g>
  
  <!-- Outer ring -->
  <circle cx="512" cy="512" r="310" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.4"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Shield shape -->
  <g transform="translate(512, 500)" filter="url(#shadow)">
    <!-- Shield outline -->
    <path d="M0,-200 L180,-145 L180,45 Q180,175 0,255 Q-180,175 -180,45 L-180,-145 Z" 
          fill="#0f0f1a" stroke="url(#accentDiag)" stroke-width="5" opacity="0.9"/>
    
    <!-- Inner shield glow -->
    <path d="M0,-185 L168,-134 L168,42 Q168,164 0,238 Q-168,164 -168,42 L-168,-134 Z" 
          fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.15"/>
    
    <!-- Car silhouette -->
    <g transform="translate(0, -20)" fill="none" stroke="url(#carGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)">
      <!-- Car body -->
      <path d="M-90,15 L-75,-30 L-42,-55 L42,-55 L75,-30 L90,15 Z"/>
      <!-- Car roof line -->
      <path d="M-62,-28 L-42,-52 L42,-52 L62,-28" stroke-width="4"/>
      <!-- Bottom line -->
      <line x1="-90" y1="15" x2="90" y2="15" stroke-width="5"/>
      <!-- Wheel wells -->
      <path d="M-55,15 Q-55,30 -42,30 Q-28,30 -28,15" stroke-width="4"/>
      <path d="M28,15 Q28,30 42,30 Q55,30 55,15" stroke-width="4"/>
      <!-- Wheels -->
      <circle cx="-42" cy="22" r="14" stroke-width="4"/>
      <circle cx="42" cy="22" r="14" stroke-width="4"/>
      <!-- Wheel centers -->
      <circle cx="-42" cy="22" r="4" fill="#00D4FF" opacity="0.8"/>
      <circle cx="42" cy="22" r="4" fill="#00D4FF" opacity="0.8"/>
      <!-- Headlights -->
      <ellipse cx="-82" cy="0" rx="5" ry="9" fill="#00D4FF" opacity="0.9"/>
      <ellipse cx="82" cy="0" rx="5" ry="9" fill="#7B2FFF" opacity="0.9"/>
      <!-- Window -->
      <path d="M-50,-25 L-38,-48 L38,-48 L50,-25" fill="#00D4FF" opacity="0.1"/>
    </g>
    
    <!-- Key symbol -->
    <g transform="translate(0, 110)" fill="none" stroke="#00D4FF" stroke-width="4" opacity="0.8" filter="url(#glow)">
      <circle cx="0" cy="0" r="18"/>
      <circle cx="0" cy="0" r="8" fill="#00D4FF" opacity="0.3"/>
      <line x1="18" y1="0" x2="55" y2="0"/>
      <line x1="55" y1="0" x2="55" y2="14"/>
      <line x1="40" y1="0" x2="40" y2="10"/>
      <line x1="55" y1="14" x2="48" y2="14"/>
    </g>
  </g>
  
  <!-- Corner accents -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.3" fill="none">
    <path d="M80,80 L80,140 M80,80 L140,80"/>
    <path d="M944,80 L944,140 M944,80 L884,80"/>
    <path d="M80,944 L80,884 M80,944 L140,944"/>
    <path d="M944,944 L944,884 M944,944 L884,944"/>
  </g>
</svg>
